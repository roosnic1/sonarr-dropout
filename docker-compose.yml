services:
  sonarr-dropout:
    image: sonarr-dropout:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonarr-dropout
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # REQUIRED: TheTVDB v4 API credentials
      # Get an API key from https://thetvdb.com/dashboard/account/apikey
      - TVDB_API_KEY=YOUR_TVDB_API_KEY_HERE
      # OPTIONAL: subscriber PIN, if your TVDB account needs one
      # - TVDB_PIN=YOUR_TVDB_PIN_HERE

      # REQUIRED: base URL this container is reachable at from Sonarr/Prowlarr
      # -- baked into the Torznab release links this service returns
      - PUBLIC_URL=http://sonarr-dropout:8080

      # yt-dlp download configuration -- paths *inside the container*, see
      # the volumes section below for how they map to the host
      - NETRC_PATH=/config/.netrc
      - DOWNLOADS_DIR=/downloads

      # OPTIONAL: Service configuration
      - SERVICE_PORT=8080
      - SERVICE_HOST=0.0.0.0

      # OPTIONAL: Prowlarr/Sonarr API key (if you want to restrict access)
      # - PROWLARR_API_KEY=YOUR_PROWLARR_API_KEY_HERE

      # OPTIONAL: Logging
      - LOG_LEVEL=INFO

    volumes:
      # dropout.tv credentials for yt-dlp, e.g.:
      #   machine dropout
      #     login you@example.com
      #     password yourpassword
      - ./config/.netrc:/config/.netrc:ro
      # Must be the SAME host path Sonarr's download client mounts as its
      # own downloads folder, so the "storage" path this service reports
      # resolves inside Sonarr's own filesystem view too.
      - ./downloads:/downloads

    # Health check -- verify HTTP server is listening (no API calls)
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Optional: Mount a .env file instead of using environment variables
    # env_file:
    #   - .env

    # Optional: If you want to run this alongside Sonarr/Prowlarr
    # networks:
    #   - prowlarr-network

# Optional: Create a network if running alongside Sonarr/Prowlarr
# networks:
#   prowlarr-network:
#     external: true