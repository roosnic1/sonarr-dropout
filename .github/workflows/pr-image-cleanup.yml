name: PR Image Cleanup

# Prunes ghcr.io pr-* image tags left over from PR testing (see the
# `docker` job in ci.yml). Runs on a schedule rather than exactly at merge
# time: each
# run asks the GitHub API which PRs are still open and deletes every pr-*
# tag whose PR number isn't in that list, so images for merged/closed PRs
# get removed within a run or two without needing an on-close trigger.
#
# Uses dataaxiom/ghcr-cleanup-action rather than actions/delete-package-versions
# because ci.yml's docker job pushes multi-platform (amd64/arm64/arm/v7) images:
# each tag is a manifest list backed by untagged per-platform manifests, and
# actions/delete-package-versions only matches its keep-pattern against tags —
# it can't see that those untagged manifests are still referenced by a kept tag
# like `latest`, tries to delete them anyway, and fails once they've inherited
# enough downloads via `latest` to trip GitHub's >5000-download delete guard.
# ghcr-cleanup-action understands manifest lists and only removes per-platform
# images that are actually orphaned.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  IMAGE_NAME: sonarr-dropout

permissions:
  contents: read
  pull-requests: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Build exclude-list from open PRs
        id: keep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          open_prs=$(gh pr list --repo "${{ github.repository }}" --state open --json number --jq '[.[] | "pr-\(.number)"] | join(",")')
          echo "exclude=${open_prs}" >> "$GITHUB_OUTPUT"

      - name: Delete pr-* tags for closed PRs
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: ${{ github.repository_owner }}
          package: ${{ env.IMAGE_NAME }}
          delete-tags: 'pr-*'
          exclude-tags: ${{ steps.keep.outputs.exclude }}