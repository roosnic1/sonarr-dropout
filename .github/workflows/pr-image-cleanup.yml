name: PR Image Cleanup

# Prunes ghcr.io pr-* image tags left over from PR testing (see the
# `docker` job in ci.yml). Runs on a schedule rather than exactly at merge
# time: each
# run asks the GitHub API which PRs are still open and deletes every pr-*
# tag whose PR number isn't in that list, so images for merged/closed PRs
# get removed within a run or two without needing an on-close trigger.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  IMAGE_NAME: sonarr-dropout

permissions:
  contents: read
  pull-requests: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Build keep-pattern from open PRs
        id: keep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          open_prs=$(gh pr list --repo "${{ github.repository }}" --state open --json number --jq '[.[].number] | join("|")')
          if [ -n "$open_prs" ]; then
            pattern="^(latest|[0-9]+(\.[0-9]+){0,2}|pr-(${open_prs}))$"
          else
            pattern="^(latest|[0-9]+(\.[0-9]+){0,2})$"
          fi
          echo "pattern=$pattern" >> "$GITHUB_OUTPUT"

      - name: Delete pr-* tags for closed PRs
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          min-versions-to-keep: 0
          ignore-versions: ${{ steps.keep.outputs.pattern }}