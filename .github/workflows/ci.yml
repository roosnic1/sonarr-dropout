name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        env:
          TVDB_API_KEY: "test-key-for-ci"
        run: pytest -q

  docker:
    # On pull_request, this also pushes a testable image to ghcr.io tagged
    # pr-<number> and sha-<short-sha> (see the tags step below) -- gated on
    # `needs: test` so a PR with failing lint/tests never gets a published
    # image. Pruned by pr-image-cleanup.yml once the PR is no longer open.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "list<<EOF"
              echo "ghcr.io/roosnic1/sonarr-dropout:pr-${{ github.event.pull_request.number }}"
              echo "ghcr.io/roosnic1/sonarr-dropout:sha-${sha:0:7}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "list=sonarr-dropout:test" >> "$GITHUB_OUTPUT"
          fi
        env:
          sha: ${{ github.event.pull_request.head.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
