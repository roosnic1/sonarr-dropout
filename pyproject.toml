[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonarr-dropout"
dynamic = ["version"]
description = "Torznab/Newznab compatible indexer bridge for dropout.tv"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "lxml>=4.9.3",
    "tvdb-v4-official>=1.1.0",
    "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
]

[tool.setuptools.dynamic]
version = {attr = "sonarr_dropout.__version__.__version__"}

[tool.setuptools]
packages = ["sonarr_dropout"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
